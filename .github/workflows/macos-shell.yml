name: macOS GUI (Intel Fix)
on: workflow_dispatch
jobs:
  shell:
    runs-on: macos-12 # <--- Intel hardware = No Black Screen
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Ngrok
        run: brew install ngrok/ngrok/ngrok

      - name: Setup Access
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFtl1llZuZ0SlJiKp+x51oTDBp8LbppuQs3qd3U9iFrG" >> ~/.ssh/authorized_keys
          
          # 2. Create VNC User (Password: vncpassword123)
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password vncpassword123 -admin
          
          # 3. Enable VNC for this user
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw vncpassword123 \
            -restart -agent -privs -all -users vncuser

      - name: Start Tunnel
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          sleep 3600
