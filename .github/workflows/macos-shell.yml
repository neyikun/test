name: macOS GUI Diagnostic
on: workflow_dispatch
jobs:
  shell:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          brew install ngrok/ngrok/ngrok
          # cliclick allows us to move the mouse via terminal
          brew install cliclick 

      - name: Setup Access & VNC
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFtl1llZuZ0SlJiKp+x51oTDBp8LbppuQs3qd3U9iFrG" >> ~/.ssh/authorized_keys
          
          # Force a password for the runner
          sudo sysadminctl -resetPasswordFor runner -newPassword yourpassword123
          
          # Enable VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw yourpassword123 \
            -restart -agent -privs -all

      - name: Start Tunnel
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          sleep 3600
