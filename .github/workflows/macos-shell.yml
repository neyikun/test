name: Fast macOS Shell Test

on:
  workflow_dispatch:

jobs:
  gui:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fast Install tmate
        run: |
          # This skips the 5-10 minute Homebrew update process
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install tmate

      - name: Start tmate session
        uses: mxschmitt/action-tmate@v3
        with:

          limit-access-to-actor: false
        timeout-minutes: 60
